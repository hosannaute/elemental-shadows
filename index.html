<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="Elemental Shadows — 2D Liquid-Silhouette Martial Arts Fighting Game built with TypeScript and PixiJS v8."
    />
    <title>Elemental Shadows — 2D Liquid-Silhouette Martial Arts Fighter</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app" class="game-shell">
      <div id="stage-frame" class="stage-frame">
        <div id="canvas-mount" class="canvas-mount"></div>
      </div>

      <!-- Non-destructive Portrait Orientation Notice for narrow portrait phones -->
      <div class="portrait-guard" aria-live="polite">
        <div class="portrait-card">
          <div class="portrait-icon">⟳</div>
          <h2>ROTATE TO LANDSCAPE</h2>
          <p>Elemental Shadows is tuned for landscape martial arts combat.</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
