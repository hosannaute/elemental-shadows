name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias elemental \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass elementalshadows \
            -keypass elementalshadows \
            -dname "CN=Elemental Shadows, OU=Mobile, O=hosannaute, L=Dojo, S=Realm, C=US"

      - name: Build signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v2.5.0-android.apk
          ls -lh out/ElementalShadows-v2.5.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v2.5.0-android-apk
          path: out/ElementalShadows-v2.5.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.5.0-android"
          NOTES=$(cat <<'EOF'
          Standalone 100% offline Android APK of **Elemental Shadows — The Hollow Avatar**.

          ### What's New in v2.5.0
          - **Three.js 2.5D WebGL Visual Enhancer (100% Offline, Preserving 2D Sumi-e Silhouettes & Exact 60Hz Mechanics):**
            - **Real-Time Dynamic 6-Light Elemental Dojo Floor Shader:** Live elemental lighting pools from both fighters, active bending waves, flickering Corner Braziers, Blade Clashes, and hazards sweep across the wooden veranda planks and basalt tiles — with animated water caustics on Tidal Shrine, volcanic heat-veins on Obsidian Caldera & Blazing Dojo, and crystalline frost glint on Frozen Peak.
            - **3D Volumetric Signature Bending Effects:** Real 3D Fresnel wind sphere + 3 tilted gyroscopic torus wind bands for **Aang's Air Scooter**; translucent 3D faceted ice crystal prism + **24 physical tumbling 3D crystal shards** with floor bounce on **Katara's Cryo Prison & CRYO SHATTER! (+40%)**; 3D orbital energy halos for Octopus Form & Iroh's Lightning Redirection; and 3D perspective floor shockwave rings on slams, Seismic Sense/Eruption, Guard Shatters, Wall Splats, and Eclipse Finishers.
            - **True 2.5D Depth-Layered Weather & Cinematic Camera Tilt:** Biome-reactive 3D particles spanning background-to-foreground (including tumbling 3D crimson Japanese maple leaves in Eclipse Citadel & Main Menu) plus subtle 2.5D perspective tilt during Ultimates, Blade Clashes, 8-Arm Octopus Multi-Slam, and `FINISH THEM!`.
            - **Android-Optimized & Toggleable:** Bundled offline in `assets/three.min.js` (zero CDN), pre-allocated pools (zero GC stalls), and a live **`2.5D WebGL FX (Three.js): ON / OFF`** switch in Pause -> Audio & AI.
          - **Katara's Overhauled 8-Arm Octopus Multi-Slam:**
            - Water's Tap / Fwd + BEND (35% meter) now activates Octopus Form AND immediately surges forward with an articulated **8-Arm Octopus Whip** (`355px` reach, also re-triggerable via `GRAB` during Octopus Form!).
            - On grab, ALL 8 sculpted ink-outlined water tentacles radiate from the caster in a Tai Chi stance and whip-slam the opponent **8 alternating times** left-to-right (`OCTOPUS SLAM 1/8` -> `7/8`), building an instant **`COMBO x8`**, before all 8 Kraken arms converge for the lethal **`8/8 OCTOPUS FINALE!`** with monochrome ink flash, slow-mo, and 3D floor water-ripple shockwaves!
          - **Polish & Readability:** Upgraded combat callout anti-overlap stacking and crisp single-counter replacement during multi-slams.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v2.5.0-android.apk --clobber
          else
            gh release create "$TAG" out/ElementalShadows-v2.5.0-android.apk \
              --title "Elemental Shadows v2.5.0 (Android APK — Three.js 2.5D Visual Enhancer & Katara 8-Arm Octopus Multi-Slam)" \
              --notes "$NOTES"
          fi
