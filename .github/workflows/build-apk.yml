name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Persistent signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) must be configured so APK updates never conflict." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Remove temporary keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Prepare & verify APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v3.4.0-android.apk
          ls -lh out/ElementalShadows-v3.4.0-android.apk
          APKSIGNER=$(ls -1d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs out/ElementalShadows-v3.4.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v3.4.0-android-apk
          path: out/ElementalShadows-v3.4.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.4.0-android"
          NOTES=$(cat <<'EOF'
          Standalone 100% offline Android APK of **Elemental Shadows — The Hollow Avatar**.

          > **Install Note:** Signed with our **permanent release keystore** (same signing key as `v3.3.x`, bumped to `versionCode 13`). Installing `v3.4.0` directly over `v3.3.0` or `v3.3.1` updates cleanly in-place with zero conflicts and preserves all saved story progress, armory unlocks, and settings.

          ### What's New in v3.4.0 (Compendium Bending Overhaul, 13x6 Story Journey & Shadow Avatar Siphon)
          - **36 Truly Unique Elemental Ultimates (Zero Shared Vortex / Arm-Swing Clones):**
            - Eliminated all generic shared tornado (`vortex`) and arm-swing (`arm_swing`) Ultimate templates across the 12 disciplines.
            - Every element now commands 3 bespoke, high-impact signature Ultimates inspired by the 12-Element Bending Compendium: Water (`Ocean Dominion Tsunami`, `Pressure Jet Cannon`, `Abyssal Maelstrom`), Fire (`Sozin's Twin Dragons`, `Solar Incarnation Nova`, `Compressed Flare Meteors`), Ice (`Glacier Cataclysm`, `Absolute Winter Domain`, `Mirror Ice Prism`), Earth (`Continental Fissure`, `Seismic Monolith Drop`, `Crystal Spire Clamp`), Air (`Atmospheric Hurricane`, `Sonic Pressure Wave`, `Valkyrie Sky Dive`), Lightning (`Heaven's Judgment`, `Thunder God Overdrive`, `Electromagnetic Railgun`), Shadow (`Eclipse Tendrils`, `Eternal Night Legion`, `Dimensional Rift Drop`), Lava (`Caldera Eruption`, `Volcanic Titan Fist`, `Obsidian Spear Storm`), Metal (`Iron Blade Barrage`, `Iron Dominion Crush`, `Liquid Mercury Surge`), Nature (`Briar Eruption`, `World Beast Stampede`, `Toxic Spore Canopy`), Sand (`Desert Sovereign Storm`, `Sandstone Pyramid Tomb`, `Mirage Clone Assault`), and Spirit (`Astral Spirit Cannon`, `Celestial Ascension`, `Soul Mandala Pillar`).
          - **12 Compendium Advanced Sub-Bendings (SUB-BEND Button):**
            - Upgraded the dedicated SUB-BEND button to each element's iconic Advanced Bending: Blood Bending (Water), Plasma Combustion (Fire), Tectonic Gravity Fault (Earth), Vacuum Sphere (Air), Thermal Extraction Flash-Freeze (Ice), Neural EMP Pulse (Lightning), Dimensional Shadow Rift (Shadow), Volcanic Eruption & Obsidian Rift (Lava), Metal Transmutation Forged Cage (Metal), Biological Adaptation Primal Chimera Beast (Nature), Vitrified Glass Formation Tomb (Sand), and Soul Manipulation Astral Bind (Spirit).
          - **Story Mode Journey — 13 Realms x 6-Bout Tribal Gauntlets (78 Story Fights):**
            - Every Realm now begins with **5 Tribe Warriors wielding 5 different weapons** (Best of 3) before unlocking the **Realm Grandmaster Boss** (Best of 5), with an interactive 6-Bout Realm Gauntlet tracker directly on the World Map.
            - **Strict Boss Power Escalation:** Every Realm Grandmaster Boss is visibly larger, wears bespoke Grandmaster Regalia (halos, crowns, thunder drums, shogun pauldrons, antlers, eclipse wings) with glowing eyes, and grows progressively stronger from Realm 1 through Realm 13.
            - **13 Unique Cultural Arena Locations:** Added bespoke sumi-e cultural arenas for Ironclad Foundry (Metal), Verdant Grove (Nature), Astral Sanctum (Spirit), Mirage Dunes Oasis Courtyard (Sand), and the Eclipse Throne (Shadow Avatar) — all 13 playable in both Story Mode and Wi-Fi Duet.
          - **Final Realm 13 — Elite Eclipse Generals & The Shadow Avatar's Bending-Theft Gauge:**
            - Fight through 5 high-tier multi-elemental **Elite Eclipse Generals** before challenging **THE SHADOW AVATAR** (wielding 12 orbiting elemental orbs & dark solar eclipse corona).
            - **Bending-Theft Bar:** A live crimson siphon gauge fills on the Shadow Avatar's HUD side during the final boss fight (accelerated by his hits, pushed back by your pressure). Defeat him before the bar reaches 100% — if it fills, he steals your bending for the round, sealing your BEND, SUB-BEND, ULTIMATE, and AVATAR SHIFT until you finish him with pure steel & martial arts!
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v3.4.0-android.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/ElementalShadows-v3.4.0-android.apk \
              --target "${{ github.sha }}" \
              --title "Elemental Shadows v3.4.0 (Android APK — Compendium Bending, 13x6 Story Journey & Shadow Avatar)" \
              --notes "$NOTES"
          fi
