name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Persistent signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) must be configured so APK updates never conflict." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Remove temporary keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Prepare & verify APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v3.3.0-android.apk
          ls -lh out/ElementalShadows-v3.3.0-android.apk
          APKSIGNER=$(ls -1d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs out/ElementalShadows-v3.3.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v3.3.0-android-apk
          path: out/ElementalShadows-v3.3.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.3.0-android"
          NOTES=$(cat <<'EOF'
          Standalone 100% offline Android APK of **Elemental Shadows — The Hollow Avatar**.

          > **Install Note:** `v3.3.0` is the first release signed with our **permanent release keystore**. If you have `v3.1.0` or `v3.2.0` installed, uninstall it **once** before installing `v3.3.0`. All future updates (`v3.3.1`, `v3.4.0`, etc.) will install cleanly in-place with zero conflicts and preserve your saved progress.

          ### What's New in v3.3.0
          - **4 New Elemental Masters (8 -> 12 Elements Across Quick Duel, Story Campaign, Armory & Wi-Fi Duet):**
            - **Metal (`TETSU` — Wing Chun Metalbender):** Chrome-silver palette, *Twin Hook Swords*, Iron Deflect parry shockback, Magnetic Grapple & Shrapnel Fan quick-bends, **Magnetic Clamp** sub-bend, and *Iron Maiden Crush* execution.
            - **Nature (`MORI` — Briar & Vine Master):** Vivid emerald-jade palette, *Thorned Nagamaki*, Verdant Roots passive regen, Vine Snare & Briar Patch hazards, **Elder Briar Prison** sub-bend, and *Elder Briar Entanglement* execution.
            - **Sand (`SUNA` — Desert Glass Bender):** Sunburst gold-amber palette, *Twin Scimitars*, Desert Mirage back-handspring clones, Quicksand Pit & Sand Geyser quick-bends, **Sand Burial** sub-bend, and *Desert Coffin Implosion* execution.
            - **Spirit (`KAMI` — Astral Energybender):** Astral magenta-rose palette, *Astral War Fans*, Astral Float mid-air hover, Chi-Lock Beam & Astral Blink quick-bends, **Energybend Chi-Seal** sub-bend, and *Astral Convergence Erasure* execution.
          - **Expanded 13-Stage Story Campaign & 4 New Arenas:**
            - Added **Master Tetsu** (*Ironclad Foundry*), **Master Mori** (*Verdant Grove*), **Master Suna** (*Mirage Dunes*), and **Master Kami** (*Astral Sanctum*) to the interactive World Map before the **13th Dan Final Eclipse Master**, with all 12 elements playable immediately in Quick Duel, Dojo, and Wi-Fi Duet.
          - **4-Layer Fighter Readability & Distinction System (Zero Confusion in Multiplayer & Mirror Matches):**
            - **Unique Per-Element Martial Silhouettes & Proportions:** Every element now has its own distinct body build and attire silhouette (flowing Tai Chi robe tails, Fire-General spiked pauldrons, Air-Nomad shawl + forehead arrow, heavy Earth armor plates, Frost hood, Lightning shinobi scarf, Shadow cowl, Lava obsidian horns, Metal lamellar armor, Nature leaf mantle & antlers, Sand desert turban & veil, Spirit floating astral halo & silk ribbon) plus colored inner obi/headband accents.
            - **Persistent Grounded `YOU` Foot Ring + Smart Cross-Up Tag:** Solid gold ground locator ring + directional chevron beneath your local fighter (contrasting dashed opponent ring), persistent tiny overhead gold chevron pip, automatic `YOU` / `FOE` tag re-flash on every side-switch / cross-up, and a configurable **Player Indicator** (`Smart` / `Always` / `Minimal`) toggle in Settings.
            - **Automatic Mirror-Match & Same-Family Alt Clan Palettes:** Mirror matches and near-color matchups automatically assign a high-contrast Alt Clan Dye to Player 2 across silhouette rims, inner accents, weapons, 3D floor lights, and HUD crests.
            - **4 New Armory & Wi-Fi Masks/Gear:** Added **Kitsune Fox Mask**, **Tengu War Mask**, **Samurai Sode Armor**, and **Blindfold Monk Wrap** selectable across Armory, Story, and the Wi-Fi Duet Lobby.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v3.3.0-android.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/ElementalShadows-v3.3.0-android.apk \
              --target "${{ github.sha }}" \
              --title "Elemental Shadows v3.3.0 (Android APK — 12 Elements & Fighter Readability Overhaul)" \
              --notes "$NOTES"
          fi
