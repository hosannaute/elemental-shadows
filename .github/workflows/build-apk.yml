name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias elemental \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass elementalshadows \
            -keypass elementalshadows \
            -dname "CN=Elemental Shadows, OU=Mobile, O=hosannaute, L=Dojo, S=Realm, C=US"

      - name: Build signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v2.3.0-android.apk
          ls -lh out/ElementalShadows-v2.3.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v2.3.0-android-apk
          path: out/ElementalShadows-v2.3.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.3.0-android"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v2.3.0-android.apk --clobber
          else
            gh release create "$TAG" out/ElementalShadows-v2.3.0-android.apk \
              --title "Elemental Shadows v2.3.0 (Android APK — Indie Visual Overhaul, 8 Avatar Tricks & Japanese Soundtrack)" \
              --notes "Standalone offline Android APK of **Elemental Shadows — The Hollow Avatar**.\n\n### What's New in v2.3.0\n- **Hand-Inked Crimson Maple Visual Overhaul:** Completely replaced dark-navy HTML menus with warm obsidian-and-gold lacquer scroll plaques, hexagonal coin badges, octagonal settings seals, custom martial-arts SVG touch medallions, and a full-bleed crimson-maple World Map with glowing elemental pins & chamfered region banners.\n- **Zero Emojis / Zero Placeholders:** Purged every Unicode emoji & placeholder glyph across HUD, pause button, touch controls, Armory, and World Map.\n- **3 New Nano Banana Painted Realms:** Added dedicated hand-painted sumi-e arenas for **Eclipse Citadel**, **Storm Spire**, and **Iron Mountain** (plus volcanic magma-veined Obsidian Caldera) so all 8 realms + Main Menu showcase cohesive indie art.\n- **8 Unique *Avatar: The Last Airbender* Signature Bending Tricks:** Katara's **Octopus Form**, **Sozin's Jet-Step**, Toph's **Seismic Sense & Earth Armor**, Aang's **Air Scooter**, Iroh's **Lightning Redirection**, Katara's **Cryo Prison**, **Eclipse Swap**, and Ghazan's **Molten Shuriken & Magma Moat**.\n- **3-Round Master Battles (Best of 5) & Deeper Duel Mechanics:** Campaign Masters now fight first to 3 rounds, plus Boss Phase-2 **Eclipse Surge** awakenings, visible **Guard Poise** bars with Guard Shatter, **Lethal / Iaijutsu Counters**, rapid-tap **Blade-Lock Weapon Clashes**, **Elemental Weapon Infusions**, upgraded weapon class perks, and **Breakable Corner Braziers**.\n- **Offline Traditional Japanese Soundtrack:** Physical-modeled **Koto**, **Shamisen**, breathy **Shakuhachi** bamboo flute, **Taiko** war drums, and **Hyoshigi** clappers — zero external audio downloads and strictly voice-capped for smooth 60fps Android play."
          fi
