name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Persistent signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) must be configured so APK updates never conflict." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Remove temporary keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Prepare & verify APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v3.5.0-android.apk
          ls -lh out/ElementalShadows-v3.5.0-android.apk
          APKSIGNER=$(ls -1d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs out/ElementalShadows-v3.5.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v3.5.0-android-apk
          path: out/ElementalShadows-v3.5.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.5.0-android"
          NOTES=$(cat <<'EOF'
          Standalone 100% offline Android APK of **Elemental Shadows — The Hollow Avatar**.

          > **Install Note:** Signed with our **permanent release keystore** (same signing key as `v3.3.x` / `v3.4.0`, bumped to `versionCode 14`). Installing `v3.5.0` directly over `v3.4.0` updates cleanly in-place with zero conflicts and preserves all saved story progress, armory unlocks, and settings.

          ### What's New in v3.5.0 (Combat Overhaul, Progressive Difficulty, Shadow Portal Drop & Engagement Update)
          - **Steeper Progressive Story Difficulty & 5 Distinct Warrior Archetypes:**
            - Each Realm's 5 Warriors now escalate steeply from Warrior 1 to Warrior 5 and from Realm 1 through Realm 13, giving Armory weapon/enchant/upgrade progression real impact: **Scout** (swift opener), **Hazard Specialist** (elemental arena hazards), **Ambush Elite** (1-round Sudden Death + Mid-Realm Chest), **Armored Enforcer** (heavy poise armor), and **Temple Guardian** (pre-boss dialogue & final test).
            - **Way Tougher, More Aggressive Realm Grandmasters & Phase 2 Awakening:** Realm Bosses scale sharply in aggression, speed, defense, and damage, triggering a glowing **Phase 2 Awakening** at 35% HP.
          - **Fixed Master 3-Round Win Rule:**
            - Realm Grandmasters & the Shadow Avatar now strictly require **3 full round wins** (Best of 5), with a duplicate-conclusion guard and full match reset on `Pause -> RESTART`.
          - **Tightened Coin Economy & Exact 1/10th Loss Consolation:**
            - Rebalanced victory payouts so Armory weapons and upgrades feel earned; losing any bout now awards **exact 1/10th** of the bout's win payout as consolation.
          - **Shadow Portal Bending (Void Suck -> Overhead Sky Portal Drop -> Ground Slam):**
            - Both Shadow's **Dimensional Rift** (`SUB-BEND`) and **Dimensional Rift Drop** (`ULTIMATE`) now open a swirling ground void portal that **sucks the opponent in**, then rips open a **second portal high above** to drop and slam them violently into the arena floor!
          - **Shadow Avatar "Shatter the Seal!" Comeback:**
            - Landing a **Perfect Parry** or **Guard Shatter** while your bending is stolen breaks the siphon seal once per round, restoring your bending and granting +50 energy.
          - **Engagement, Retention & Replayability (100% Offline):**
            - **Daily Login Streak (Day 1–7 Chests)** & **3 Date-Seeded Daily Challenges** on the Main Menu.
            - **Warrior Rank (`INITIATE` to `AVATAR`), Per-Element Mastery (Lv.1–10), & 18 Achievements** in the new **Chronicles** modal.
            - **Early Shadow Tower Unlock** immediately after clearing Realm 1 (with milestone bonuses at Waves 5/10/15/20), **Interactive Arena Braziers** (5s Shrine Surge), **Dojo 3-Step Combo Trials**, and an upgraded **Post-Match Victory Summary Card** with Armory readiness prompts.
          - **Wi-Fi Duet Rivalry, Party Modes & Native Low-Latency Fixes:**
            - Added live **Session Rivalry Scoreboard & Win-Streak Crown**, **Party Modes** (`Standard`, `Random Master`, `Avatar Roulette`, `Mirror Match`), post-match **Duel Stats Card**, and a **`RESPECT`** emote stamp.
            - Native Android **`WifiLock` (`WIFI_MODE_FULL_LOW_LATENCY`)**, zero-delay Host input RX dispatch, 60Hz Client interpolation & projectile extrapolation, expanded `600x560` silhouette buffers (zero clipping), instant mobile Magic cast/swipe responsiveness, and all v3.4 audit fixes (`G-1..G-8`, `W-1..W-3`, `V-1..V-4`, `R-1..R-3`).
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v3.5.0-android.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/ElementalShadows-v3.5.0-android.apk \
              --target "${{ github.sha }}" \
              --title "Elemental Shadows v3.5.0 (Android APK — Combat Overhaul, Shadow Portal Drop & Engagement Update)" \
              --notes "$NOTES"
          fi
