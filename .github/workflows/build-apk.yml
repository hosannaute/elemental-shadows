name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp mobile/index.html android/app/src/main/assets/www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias elemental \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass elementalshadows \
            -keypass elementalshadows \
            -dname "CN=Elemental Shadows, OU=Mobile, O=hosannaute, L=Dojo, S=Realm, C=US"

      - name: Build signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v2.0.0-android.apk
          ls -lh out/ElementalShadows-v2.0.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v2.0.0-android-apk
          path: out/ElementalShadows-v2.0.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.0-android"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v2.0.0-android.apk --clobber
          else
            gh release create "$TAG" out/ElementalShadows-v2.0.0-android.apk \
              --title "Elemental Shadows v2.0.0 (Android APK)" \
              --notes "Standalone offline Android APK of **Elemental Shadows — The Hollow Avatar**.\n\n- 8 Elemental Disciplines & 32 Directional Quick-Bends\n- 9 Weapon Movesets, Wave Clashes, Redirection, Wall Splats & Disarming\n- Full 1st–9th Dan Story Campaign, 8-Region World Map, Visual Armory & Guided Dojo Lesson\n- Android-Optimized Low-VFX Boost (zero shadowBlur lag), Floating Joystick, GRAB & Avatar Shift touch controls, Landscape Immersive Fullscreen & Hardware Back support.\n\n**How to install on Android:** Download \`ElementalShadows-v2.0.0-android.apk\`, tap to open, and allow *Install from this source* if prompted."
          fi
