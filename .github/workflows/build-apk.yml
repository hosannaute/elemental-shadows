name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias elemental \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass elementalshadows \
            -keypass elementalshadows \
            -dname "CN=Elemental Shadows, OU=Mobile, O=hosannaute, L=Dojo, S=Realm, C=US"

      - name: Build signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v2.2.0-android.apk
          ls -lh out/ElementalShadows-v2.2.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v2.2.0-android-apk
          path: out/ElementalShadows-v2.2.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0-android"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v2.2.0-android.apk --clobber
          else
            gh release create "$TAG" out/ElementalShadows-v2.2.0-android.apk \
              --title "Elemental Shadows v2.2.0 (Android APK — Indie Sumi-e Art, Armory Showcase & Haptics)" \
              --notes "Standalone offline Android APK of **Elemental Shadows — The Hollow Avatar**.\n\n### What's New in v2.2.0\n- **Shadow Fight 2–Style 3-Column Armory Showcase:** Vertically scrollable left item list (no more squashed bottom tiles), auto-fit live dojo showcase preview so long weapons (Naginata, Imperial Bo Staff, Titan Warhammer) never get clipped, interactive tap-to-swing flourish, and custom vector SVG weapon/gear icons.\n- **Unified Hand-Painted Sumi-e Art Across All 8 Realms:** New Nano Banana hand-painted backdrops for Tidal Shrine, Sky Monastery, and Frozen Peak plus painterly glazed editions for Iron Mountain, Storm Spire, Obsidian Caldera, and Eclipse Citadel — removing flat vector triangles, redundant pillars, and generic dark-navy HTML styling.\n- **Crisp Mobile Visuals at 60fps:** High-DPI Retina canvas scaling, seamless joint-free silhouettes in Armory & Story cutscenes, zero-blur elemental rim outlines, weapon swing ribbons, and ambient elemental auras active in Android Low Boost mode.\n- **Sculpted Weapons & Hokusai Bending Waves:** Tapered organic weapon silhouettes, Hokusai-style clawing foam waves, cinematic letterboxed dialogue scenes with Master crests, and custom elemental crest pins on the World Map.\n- **Native Android Haptics & Swipe-to-Bend:** Native vibration feedback on hits, parries, clashes, and KOs plus 4-way swipe-to-bend directly on the BEND button."
          fi
