name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Persistent signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) must be configured so APK updates never conflict." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Remove temporary keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Prepare & verify APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v3.3.1-android.apk
          ls -lh out/ElementalShadows-v3.3.1-android.apk
          APKSIGNER=$(ls -1d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs out/ElementalShadows-v3.3.1-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v3.3.1-android-apk
          path: out/ElementalShadows-v3.3.1-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.3.1-android"
          NOTES=$(cat <<'EOF'
          Standalone 100% offline Android APK of **Elemental Shadows — The Hollow Avatar**.

          > **Install Note:** Signed with our **permanent release keystore** (same signing key as `v3.3.0`, bumped to `versionCode 12`). Installing `v3.3.1` directly over `v3.3.0` updates cleanly in-place with zero conflicts and preserves all saved story progress, armory unlocks, and settings.

          ### What's New in v3.3.1 (Wi-Fi Duet, Combat & Campaign Stability Release)
          - **Wi-Fi Duet Networking & Lifecycle Fixes:**
            - Fixed stale round/lobby packet races across rematches via per-match sequence IDs (`matchSeq`) and automatic lobby state resync when returning to lobby.
            - Forwarded heartbeats (`hb`) to the game loop and added pause-aware native JS queue deferral with tail-only snapshot coalescing in `WifiDuelManager` so backgrounding either phone no longer triggers false disconnects, stuck inputs, or out-of-order `go`/`over`/`lobby` delivery.
            - Reordered `MainActivity` `onResume`/`onPause` lifecycle hooks and immediately release held Client inputs (`in/rst`) on pause.
            - Fixed Wi-Fi Client visual/audio parity: hitstop timing, ambient elemental aura particles, decoy clone owner tinting, grab-wave tip coords, `lastSlamF` clamping, `'crystalShatter'` SFX, `'parry'` haptics, `'head'` hit height, and fair alternating clash order per frame.
            - Fixed Wi-Fi keyboard controls symmetry (`KeyJ` weapon, disabled unsupported keys in Wi-Fi) and properly aligned the Host PIN badge row (`.wifi-pin-row` / `.wifi-pin-badge`).
          - **Combat, Physics & Elemental Ability Fixes:**
            - Hardened `bendingWaves`, `decoyClones`, and `resolveHit` against mid-loop array mutations and post-KO/Finish-Him interference (purging loser projectiles/stances on Finish-Him, pausing Finish-Him countdown during grabs, and preventing melee deflection of stationary ground hazards).
            - Fixed explicit ground-anchored vs center-anchored hitboxes (`GROUND_ANCHORED_KINDS`), upright pulls (`water_pull`/`metal_pull`/`vine_pull`), grab-immunity checks on sub-bends (`sub_combustion`/`sub_vacuum`/`sub_soul_bind`/`sub_mag_clamp`/`sub_briar_cage`/`sub_spirit_seal`), `sub_sand_coffin` whiff/interruption cleanup, and `chilock` enforcement across counters/clashes/drains.
            - Activated all 12 native elemental weapon perks on default weapons and wired Armory mask/gear perks (`crown`, `monk`, `cloak`, `kitsune`, `sode`, `kasa`) + Spirit `astralFloat` levitation surge + `sub_bend`/`quick_bend` poses.
            - Fixed `stormFlashFrames` decay, `caldera_floor` & `volcanic` lava hazard spawning (`lastX` tracking), and Tutorial Step 3 sparring AI.
          - **Story Campaign, Shadow Tower & UI Fixes:**
            - Fixed Story World Map sequential stage unlocking & next-stage focus across all 13 stages, Story Memory timer cleanup when exiting to menu/modals, and `heroEl`/`altFoe` story panel artwork rendering.
            - Fixed Shadow Tower (`endless`) off-by-one wave progression, full P2/backdrop reset between waves, and Wave 1 reset on Rematch.
            - Fixed `pointercancel` on `#btn-magic` so interrupted gestures do not trigger unintended bending, preserved World Map when closing Settings opened from the map, updated Main Menu footer (`12 Disciplines · 12 Weapons`), Pause Move Guide labels, and Eclipse Citadel 3D maple leaves + alt-palette wave/decoy lighting.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v3.3.1-android.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/ElementalShadows-v3.3.1-android.apk \
              --target "${{ github.sha }}" \
              --title "Elemental Shadows v3.3.1 (Android APK — Wi-Fi Duet & Gameplay Stability Update)" \
              --notes "$NOTES"
          fi
