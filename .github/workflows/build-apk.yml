name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias elemental \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass elementalshadows \
            -keypass elementalshadows \
            -dname "CN=Elemental Shadows, OU=Mobile, O=hosannaute, L=Dojo, S=Realm, C=US"

      - name: Build signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v2.1.0-android.apk
          ls -lh out/ElementalShadows-v2.1.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v2.1.0-android-apk
          path: out/ElementalShadows-v2.1.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.1.0-android"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v2.1.0-android.apk --clobber
          else
            gh release create "$TAG" out/ElementalShadows-v2.1.0-android.apk \
              --title "Elemental Shadows v2.1.0 (Android APK — Art & Touch Fix)" \
              --notes "Standalone offline Android APK of **Elemental Shadows — The Hollow Avatar**.\n\n### What's New in v2.1.0\n- **Touch Controls Fix:** Movement joystick & action buttons automatically hide during Round Over / Match Over / Menus and sit beneath the Victory/Rematch overlay so **REMATCH**, **NEXT MASTER**, **ARMORY**, and **MAIN MENU** are never blocked.\n- **Nano Banana Artwork + Zero-Slop Cohesive Visuals:** Painted Blazing Dojo arena, hand-inked World Map parchment scroll, custom Android Adaptive Icon, 8 bespoke realm backdrops with shared rice-paper grain, real-time floor reflections, sumi-e brushstroke slash arcs, and live ambient weather."
          fi
