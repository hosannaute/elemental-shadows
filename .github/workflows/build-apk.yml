name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias elemental \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass elementalshadows \
            -keypass elementalshadows \
            -dname "CN=Elemental Shadows, OU=Mobile, O=hosannaute, L=Dojo, S=Realm, C=US"

      - name: Build signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v3.2.0-android.apk
          ls -lh out/ElementalShadows-v3.2.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v3.2.0-android-apk
          path: out/ElementalShadows-v3.2.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.2.0-android"
          NOTES=$(cat <<'EOF'
          Standalone 100% offline Android APK of **Elemental Shadows — The Hollow Avatar**.

          ### What's New in v3.2.0
          - **Java <-> JS Bridge & Thread Safety Hardening (`B-1`..`B-4`):**
            - Replaced unbounded `BufferedReader.readLine()` with a bounded UTF-8 frame reader (`MAX_LINE_BYTES = 16384`), `SO_TIMEOUT` read timeouts, and peer keepalive/idle timeouts so malformed TCP streams can never trigger `OutOfMemoryError` or UI ANRs.
            - Synchronized all TCP/UDP socket & `MulticastLock` transitions under a dedicated `stateLock` and coalesced inbound `evaluateJavascript` dispatches per 16ms UI frame (`__onWifiDuelBatch`).
            - Added strict `Object.prototype.hasOwnProperty` + finite-number/hex-color/LAN-IPv4 allowlists across `applyNetEvents`, `applyStateSnapshot`, `escapeHtml` (including `'`), and `connectToHost`, plus `\u2028`/`\u2029` escaping and off-thread local IP caching.
          - **Wi-Fi Duet Cryptographic Security & Anti-Cheat (`W-1`..`W-6`):**
            - **Room PIN + Challenger Knock Handshake:** Added 4-digit `SecureRandom` Dojo Room PINs with mutual HMAC-SHA256 challenge-response, HMAC-signed `v2` UDP beacons bound to source IP, and non-blocking 1-Tap Knock w/ Host **ACCEPT / DECLINE** so bystanders on shared Wi-Fi cannot snipe `ServerSocket.accept()` or spoof beacons.
            - Enforced strict sender-role & state checks (`go`, `over`, `lob`, `rm`, `lobby`), clamped directional axes strictly to `{-1, 0, 1}`, whitelisted network buttons (`weapon`, `kick`, `magic`, `subbend`), capped per-frame inputs & `bladeClash` mash rates, bounded `discovered` hosts & `ping`/`pong` rates, protected control packets from `sendQueue` eviction, and added state + 30f cooldown guards to `triggerAvatarShift`.
          - **Android 13–15 Lifecycle, OOM Prevention & Gameplay Polish (`L-1`..`L-7` + Combat Audit):**
            - Paused/resumed UDP discovery/beacons & `MulticastLock` across `onPause()`/`onResume()`, added live-match `WIFI · STALLED` heartbeat detection, registered `OnBackInvokedCallback` (`targetSdk 35`) with debounced Back evaluation & 2-step connected-Lobby Back guard, shrank `#map-canvas`/`#armory-preview` buffers before DOM replacement, auto-resumed unlocked WebAudio on app resume, fixed `playShakuhachi` voice accounting, aborted pending `connect()` immediately on `disconnect()`, added graceful `renderCrashCount > 4` fallback UI, capped `particles`/`callouts`/`ghosts`, and set `allowBackup="false"`.
            - Fixed `great_hammer` Titan Warhammer `hammer_armor` poise perk, eliminated P1 melee port-priority bias with symmetric hitbox snapshotting & simultaneous **THROW TECH!**, hardened `sub_bloodbend`/`sub_metal_wire`/`octopus_8_swing`/`ult_arm_swing` against stuck `grabbed` states on interrupt/Enlightenment, added 6f Bloodbending telegraph + Chi Resistance, grounded attackers cleanly on `"FINISH THEM!"` executions, made Wi-Fi `soulGlow`/3D seal lighting/round markers 100% P1/P2 symmetric, and prevented camera clipping at corner-to-corner distance.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v3.2.0-android.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/ElementalShadows-v3.2.0-android.apk \
              --target "${{ github.sha }}" \
              --title "Elemental Shadows v3.2.0 (Android APK — Security Audit, Wi-Fi PIN & Combat Polish)" \
              --notes "$NOTES"
          fi
