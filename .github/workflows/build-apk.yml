name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest mobile build and art assets into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp mobile/index.html android/app/src/main/assets/www/index.html
          cp -r mobile/assets/* android/app/src/main/assets/www/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias elemental \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass elementalshadows \
            -keypass elementalshadows \
            -dname "CN=Elemental Shadows, OU=Mobile, O=hosannaute, L=Dojo, S=Realm, C=US"

      - name: Build signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK deliverable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ElementalShadows-v3.1.0-android.apk
          ls -lh out/ElementalShadows-v3.1.0-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementalShadows-v3.1.0-android-apk
          path: out/ElementalShadows-v3.1.0-android.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.1.0-android"
          NOTES=$(cat <<'EOF'
          Standalone 100% offline Android APK of **Elemental Shadows — The Hollow Avatar**.

          ### What's New in v3.1.0
          - **Seamless 100% Offline 2-Player Wi-Fi / Hotspot Duet Mode:**
            - Fight a friend face-to-face on two Android phones connected to the **same Wi-Fi network** OR with **one phone's Wi-Fi Hotspot** (zero internet, zero mobile data, zero location permission popups!).
            - **1-Tap Auto-Discovery + Short Dojo Room Code:** Native Android UDP discovery beacons + direct Hotspot gateway probing let Player 2 tap **JOIN** in one touch, with short Room Code (`e.g. 43.1`) and IP fallback.
            - **Live Connected 2P VS Lobby:** Customize your Fighter Name, pick any of the 8 Elements, 9 Weapons, 5 Weapon Enchantment Seals, 5 Gear pieces, Grandmaster Scroll & Avatar Shift toggles, Host-picked painted Arena Stages, and Best of 3 / Best of 5 format — all updating live across both phones.
            - **Low-Latency Host-Authoritative 60Hz Sync:** Native `TCP_NODELAY` (`IPTOS_LOWDELAY`) transport with automatic stale-snapshot dropping, full SFX/haptics/callouts/banners/Three.js 3D FX relay, live `WIFI · Xms` HUD ping indicator, symmetric Shadow Fight 2 4-button controls for BOTH Player 1 & Player 2, `{Winner Name} WINS` banners, mutual instant **REMATCH**, and **SWITCH ELEMENT** back to the connected lobby without re-pairing.
          - **4 Major Android Stability & Crash Fixes:**
            - **WebView Renderer-Gone Auto-Recovery:** Added `onRenderProcessGone` handling in `MainActivity` to cleanly disconnect sockets and recreate the WebView instead of force-closing if Android OS kills the renderer under memory pressure, plus `largeHeap` and soft-keyboard `configChanges` protection.
            - **Android GPU/VRAM Budget Optimization:** Capped 2D and Three.js WebGL backing resolution on Android devices, disabled costly 4x mobile MSAA, added `webglcontextlost`/`webglcontextrestored` recovery, and shrank closed modal canvases (`story`, `map`, `armory`) to `1x1` on close and `onTrimMemory`.
            - **WebAudio Voice Leak Fix:** Enforced voice caps and guaranteed node disconnects on `playNoiseBurst()` and audio buffers to prevent native Android OOM / audio glitches during long sessions.
            - **Zero-Draw Background & Screen-Lock Suspension:** Native `onPause`/`onResume` bridge + `visibilitychange` cleanly suspends the game loop, Three.js rendering, and WebAudio when backgrounded or screen-locked, eliminating GPU context loss crashes on resume.
          - **Preserves Everything from v3.0.0:**
            - Streamlined Shadow Fight 2 4-button touch cluster (`PUNCH`, `KICK`, `BEND`, `SUB`, optional `SHIFT`), all 8 Secret ATLA Sub-Bending Arts & Grandmaster Scrolls, 5 Weapon Enchantment Seals & 3D Volumetric Slash Ribbons, sculpted Hokusai 8-Arm Octopus Whip, all 8 bespoke "FINISH THEM!" executions, Boss Phase-2 Awakening cut-ins, dynamic 3-tier Japanese soundtrack, and Daily Trial / Shadow Tower mutators.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ElementalShadows-v3.1.0-android.apk --clobber
          else
            gh release create "$TAG" out/ElementalShadows-v3.1.0-android.apk \
              --title "Elemental Shadows v3.1.0 (Android APK — Crash Fixes & 2P Wi-Fi/Hotspot Duet)" \
              --notes "$NOTES"
          fi
